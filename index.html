<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HUD</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #game-page {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #hud-container {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 540px;
    height: 140px;
    background: linear-gradient(180deg, rgba(20,20,25,0.85), rgba(10,10,14,0.85));
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    z-index: 10;
    display: flex;
  }

  #player-icon-container {
    width: 130px;
    height: 100%;
    background: rgba(0,0,0,0.4);
    border-right: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px 0 0 14px;
    flex-shrink: 0;
  }

  #stats-container {
    width: 250px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: 0 14px;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-label {
    width: 80px;
    font-family: sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
  }

  .stat-bar {
    flex: 1;
    height: 12px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
  }

  #hud-divider {
    width: 1px;
    height: 100%;
    background: rgba(255,255,255,0.15);
    flex-shrink: 0;
  }

  #currency-container {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    padding: 0 14px;
    box-sizing: border-box;
  }

  .currency-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .currency-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
  }

  .currency-value {
    font-family: sans-serif;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
  }
</style>
</head>
<body>

<div id="game-page">

  <div id="hud-container">
    <div id="player-icon-container"></div>
    <div id="stats-container">
      <div class="stat-row">
        <span class="stat-label">Health</span>
        <div id="health-bar" class="stat-bar"></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">Magic Charge</span>
        <div id="magic-charge-bar" class="stat-bar"></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">Power Level</span>
        <div id="power-level-bar" class="stat-bar"></div>
      </div>
    </div>
    <div id="hud-divider"></div>
    <div id="currency-container">
      <div class="currency-row">
        <div class="currency-icon" id="cash-icon">💵</div>
        <span class="currency-value" id="cash-value">0</span>
      </div>
      <div class="currency-row">
        <div class="currency-icon" id="diamonds-icon">💎</div>
        <span class="currency-value" id="diamonds-value">0</span>
      </div>
      <div class="currency-row">
        <div class="currency-icon" id="soul-cores-icon">🔮</div>
        <span class="currency-value" id="soul-cores-value">0</span>
      </div>
      <div class="currency-row">
        <div class="currency-icon" id="goblin-teeth-icon">🦷</div>
        <span class="currency-value" id="goblin-teeth-value">0</span>
      </div>
    </div>
  </div>

</div>

</body>
</html>
